<div class="container mt-4">

  <div class="card">

    <div class="card-header d-flex justify-content-between align-items-center">
      <span>Generar Jornada</span>

       <button class="btn btn-secondary" (click)="onBack()">
              <i class="bi bi-arrow-left"></i> Regresar
            </button>
    </div>

    <div class="card-body">

      <div class="mb-3">
        <label class="form-label">Torneo</label>

        <select class="form-select" [(ngModel)]="torneoId">

          <option [ngValue]="null">
            Seleccione un torneo
          </option>

          <option *ngFor="let torneo of torneos" [value]="torneo.id">
            {{ torneo.nombre }}
          </option>

        </select>
      </div>
      
      <button class="btn btn-primary" (click)="generarJornada()">
        Generar Jornada
      </button>

    </div>

    <div class="mt-4" *ngIf="jornadas.length > 0">

      <h5>Jornada generada</h5>

     <table class="table table-striped table-bordered mt-2">
        <thead>
          <tr>
            <th>Torneo</th>
            <th>Grupo</th>
            <th>Local</th>
            <th>Visitante</th>
            <th>Fecha</th>
            <th>Hora</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let j of jornadas">

            <!-- SOLO LECTURA -->
            <td>{{ j.torneo }}</td>
            <td>{{ j.grupo }}</td>

            <!-- EDITABLE -->
            <td>
              <input class="form-control"
                    type="text"
                    [(ngModel)]="j.local"
                    name="local{{j.torneo}}{{j.grupo}}">
            </td>

            <td>
              <input class="form-control"
                    type="text"
                    [(ngModel)]="j.visitante"
                    name="visitante{{j.torneo}}{{j.grupo}}">
            </td>

            <td>
              <input class="form-control"
                    type="date"
                    [(ngModel)]="j.fecha"
                    name="fecha{{j.torneo}}{{j.grupo}}">
            </td>

            <td>
              <input class="form-control"
                    type="time"
                    [(ngModel)]="j.hora"
                    name="hora{{j.torneo}}{{j.grupo}}">
            </td>

          </tr>

         
        <button class="btn btn-primary" (click)="generarJornada()">
          Guardar Jornada
        </button>
        </tbody>
      </table>    

    </div>

  </div>

</div>
