<div class="row row-cols-1 row-cols-md-2 g-4">
  <div class="col" *ngFor="let entity of entities">
    <div class="card h-100 shadow-sm">
      <div class="card-body d-flex flex-column justify-content-between">
        <div>
          <h5 class="card-title">{{ entity.label }}</h5>
          <p class="card-text">Accede al CRUD de {{ entity.label }}.</p>
        </div>
        <a [routerLink]="[entity.path]" class="btn btn-primary mt-3">Abrir CRUD</a>
      </div>
    </div>
  </div>
</div>
