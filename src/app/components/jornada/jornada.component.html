<div class="container mt-4">

  <div class="card">

    <div class="card-header d-flex justify-content-between align-items-center">
      <span>Generar Jornada</span>

      <button
        class="btn btn-secondary"
        (click)="onBack()">
        <i class="bi bi-arrow-left"></i>
        Regresar
      </button>
    </div>

    <div class="card-body">

      <div class="mb-3">
        <label class="form-label">Torneo</label>

        <select
          class="form-select"
          [(ngModel)]="torneoId">

          <option [ngValue]="null">
            Seleccione un torneo
          </option>

          <option
            *ngFor="let torneo of torneos"
            [ngValue]="torneo.id">

            {{ torneo.nombre }}

          </option>

        </select>
      </div>

      <button
        class="btn btn-primary"
        (click)="generarJornada()">
        Generar Jornada
      </button>

    </div>

    <div
      class="mt-4 p-3"
      *ngIf="jornadas.length > 0">

      <h5>Jornada generada</h5>

      <table class="table table-striped table-bordered mt-2">

        <thead>

          <tr>
            <th>Torneo</th>
            <th>Grupo</th>
            <th>ESTADO</th>
            <th>JORNADA</th>
            <th>Fecha Programada</th>
          </tr>

        </thead>

        <tbody>

          <tr *ngFor="let j of jornadas; let i = index">

            <td>{{ j.torneo }}</td>

            <td>{{ j.grupo }}</td>

            <td>{{ j.estado }}</td>

            <td>{{ j.numeroJornada }}</td>

            <td>{{ j.fechaProgramada }}</td>           
       

          </tr>

        </tbody>

      </table>

      <div class="mt-3">

        <button
          class="btn btn-success"
          (click)="guardarJornada()">

          <i class="bi bi-save"></i>
          Generar Partidos Para la Jornada
        </button>

      </div>

    </div>

  </div>

</div>
