<div class="row row-cols-1 row-cols-md-3 g-2">
  <div class="col" *ngFor="let entity of entities">
    <div class="card shadow-sm" style="max-width: 220px; margin: auto;">

      <img
        [src]="entity.image"
        [alt]="entity.label"
        class="card-img-top"
        style="height: 100px; object-fit: contain; padding: 10px;">

      <div class="card-body p-2 text-center">
        <h6 class="card-title mb-1">{{ entity.label }}</h6>

        <p class="card-text small mb-2">
          Administrador de {{ entity.label }}.
        </p>

        <a [routerLink]="[entity.path]" class="btn btn-sm btn-primary">
          Abrir
        </a>
      </div>

    </div>
  </div>
</div>
