<div class="d-flex align-items-center justify-content-center vh-100 bg-light">
  <div class="card shadow-sm login-card">
    <div class="card-body">
      <h4 class="card-title text-center mb-4">Ingreso al sistema</h4>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label for="nombreUsuario" class="form-label">Usuario</label>
          <input id="nombreUsuario" type="text" class="form-control" formControlName="nombreUsuario" placeholder="Ingrese su usuario" />
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Contraseña</label>
          <input id="password" type="password" class="form-control" formControlName="password" placeholder="Ingrese su contraseña" />
        </div>
        <button type="submit" class="btn btn-primary w-100">Ingresar</button>
      </form>
    </div>
  </div>
</div>
