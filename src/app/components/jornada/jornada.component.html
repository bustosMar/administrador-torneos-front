<div class="container mt-4">

  <div class="card">

    <div class="card-header d-flex justify-content-between align-items-center">
      <span>Generar Jornada</span>

      <button
        class="btn btn-secondary"
        (click)="onBack()">
        <i class="bi bi-arrow-left"></i>
        Regresar
      </button>
    </div>

    <div class="card-body">

      <div class="mb-3">
        <label class="form-label">Torneo</label>

        <select
          class="form-select"
          [(ngModel)]="torneoId">

          <option [ngValue]="null">
            Seleccione un torneo
          </option>

          <option
            *ngFor="let torneo of torneos"
            [ngValue]="torneo.id">

            {{ torneo.nombre }}

          </option>

        </select>
      </div>

      <button
        class="btn btn-primary"
        (click)="generarJornada()">
        Generar Jornada
      </button>

    </div>

    <div
      class="mt-4 p-3"
      *ngIf="jornadas.length > 0">

      <h5>Jornada generada</h5>

      <table class="table table-striped table-bordered mt-2">

        <thead>

          <tr>
            <th>Torneo</th>
            <th>Grupo</th>
            <th>Local</th>
            <th>Visitante</th>
            <th>Fecha</th>
            <th>Hora</th>
            <th width="120">Acciones</th>
          </tr>

        </thead>

        <tbody>

          <tr *ngFor="let j of jornadas; let i = index">

            <td>{{ j.torneo }}</td>

            <td>{{ j.grupo }}</td>

            <td>
              <input
                class="form-control"
                type="text"
                [(ngModel)]="j.local"
                [name]="'local' + i">
            </td>

            <td>
              <input
                class="form-control"
                type="text"
                [(ngModel)]="j.visitante"
                [name]="'visitante' + i">
            </td>

            <td>
              <input
                class="form-control"
                type="date"
                [(ngModel)]="j.fecha"
                [name]="'fecha' + i">
            </td>

            <td>
              <input
                class="form-control"
                type="time"
                [(ngModel)]="j.hora"
                [name]="'hora' + i">
            </td>

            <td class="text-center">

              <button
                type="button"
                class="btn btn-danger btn-sm"
                (click)="eliminarJornada(i)">

                <i class="bi bi-trash"></i>

              </button>

            </td>

          </tr>

        </tbody>

      </table>

      <div class="mt-3">

        <button
          class="btn btn-success"
          (click)="guardarJornada()">

          <i class="bi bi-save"></i>
          Guardar Jornada

        </button>

      </div>

    </div>

  </div>

</div>
