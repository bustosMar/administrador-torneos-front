<h3>{{title}}</h3>

<button class="btn btn-primary my-3" [routerLink]="['/usuarios/create']">Crear Usuario</button>

@if (usuarios.length == 0) {
<div class="alert alert-warning">No hay registros en el sistema!</div>
} @else {
<table class="table table-hover table-striped">
    <thead>
        <tr>
            <th>id</th>
            <th>name</th>
            <th>lastname</th>
            <th>nombre usuario</th>
            <th>remove</th>
            <th>update</th>
        </tr>
    </thead>
    <tbody>
        @for (usuario of usuarios; track $index) {
        <tr>
            <td> {{usuario.id}} </td>
            <td> {{usuario.nombre}} </td>
            <td> {{usuario.apellido}} </td>
            <td> {{usuario.nombreUsuario}} </td>
            <td>
                <button class="btn btn-danger btn-sm"
                (click)="onRemoveusuario(usuario.id)"
                >
                    remove
                </button>
            </td>
            <td>
                <button class="btn btn-info btn-sm"
                [routerLink]="['/usuarios/edit', usuario.id]">
                    update
                </button>
            </td>
        </tr>
        }
    </tbody>
</table>
}
