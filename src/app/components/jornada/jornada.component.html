<div class="container mt-4">

  <div class="card">

    <div class="card-header d-flex justify-content-between align-items-center">
      <span>Generar Jornada</span>

      <button
        class="btn btn-secondary"
        (click)="onBack()">
        <i class="bi bi-arrow-left"></i>
        Regresar
      </button>
    </div>

    <div class="card-body">

      <div class="mb-3">

        <label class="form-label">Torneo</label>

        <select
          class="form-select"
          [(ngModel)]="torneoId"
          (ngModelChange)="onTorneoChange($event)">

          <option [ngValue]="null">
            Seleccione un torneo
          </option>

          <option
            *ngFor="let torneo of torneos"
            [ngValue]="torneo.id">

            {{ torneo.nombre }}

          </option>

        </select>

        <label class="form-label mt-3">Categoría</label>

        <select
          class="form-select"
          [(ngModel)]="categoriaId">

          <option [ngValue]="null">
            Seleccione una categoría
          </option>

          <option
            *ngFor="let categoria of categoriasDisponibles"
            [ngValue]="categoria.id">

            {{ categoria.categoriaNombre }}

          </option>

        </select>

      </div>

      <button
        class="btn btn-primary"
        (click)="generarJornadas()">
        Generar Jornada
      </button>

    </div>

    <div
      class="alert alert-info mx-3 mt-3"
      *ngIf="mensajeJornadas">
      {{ mensajeJornadas }}
    </div>

    <div
      class="mt-4 p-3"
      *ngIf="jornadas.length > 0">

      <h5>Jornada generada</h5>

      <table class="table table-striped table-bordered mt-2">

        <thead>
          <tr>
            <th>Torneo</th>
            <th>ESTADO</th>
            <th>JORNADA</th>
            <th>Fecha Jornada</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let j of jornadas; let i = index">

            <td>{{ j.torneo }}</td>
            <td>{{ j.estado }}</td>
            <td>{{ j.numeroJornada }}</td>
            <td>{{ j.fechaProgramada }}</td>

          </tr>
        </tbody>

      </table>

      <div class="mt-4" *ngIf="jornadaVisualizada">

        <h5>
          Partidos de las Jornadas por Grupo
        </h5>

        <table class="table table-bordered table-striped">

          <thead>
            <tr>
              <th>Grupo</th>
              <th>Local</th>
              <th>Visitante</th>
              <th>Fecha Partido</th>
              <th>Hora</th>
            </tr>
          </thead>

          <tbody>
            <tr *ngFor="let partido of jornadaVisualizada.partidos; let i = index">

              <td>
                <input
                  type="text"
                  class="form-control"
                  [value]="partido.grupo || jornadaVisualizada.grupo || 'Sin grupo'"
                  readonly>
              </td>

              <td>
                <input
                  type="text"
                  class="form-control"
                  [(ngModel)]="partido.equipoLocal"
                  readonly>
              </td>

              <td>
                <input
                  type="text"
                  class="form-control"
                  [(ngModel)]="partido.equipoVisitante"
                  readonly>
              </td>

              <td>
                <input
                  type="date"
                  class="form-control"
                  [(ngModel)]="partido.fecha">
              </td>

              <td>
                <input
                  type="time"
                  class="form-control"
                  [(ngModel)]="partido.hora">
              </td>

            </tr>
          </tbody>

        </table>
      </div>

      <div class="mt-3">

        <button
          class="btn btn-primary me-2"
          (click)="generarJornada()">

          <i class="bi bi-eye"></i>
          Visualizar Partidos Para la Jornada

        </button>

        <button
          class="btn btn-success"
          [disabled]="!jornadaVisualizada || !jornadaVisualizada.partidos?.length"
          (click)="guardarPartidos()">

          <i class="bi bi-save"></i>
          Guardar Partidos Para la Jornada

        </button>

      </div>

    </div>

  </div>

</div>
